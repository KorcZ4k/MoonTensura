name: Rodar Bot Python 24-7

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */5 * * *'

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
    - name: Baixando o codigo do bot
      uses: actions/checkout@v4

    - name: Configurando Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalando as dependencias do Python
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install discord.py; fi

    - name: Ligando o Bot Python
      run: python main.py
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}